<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title"><title id="title">14  研究全貌中的当前工作</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#A6A6A6"/></marker></defs><g font-family="Microsoft YaHei, Arial, sans-serif"><rect x="0" y="0" width="1280" height="720" rx="4" fill="white" stroke="none"/><text x="36" y="55" font-size="30" fill="#202632" font-weight="700">14  研究全貌中的当前工作</text><text x="36" y="95" font-size="21" fill="#555555" font-weight="400">方向名称随任务改变；高亮表示研究定位，不表示全部已经完成。</text><path d="M36,115 L1244,115" stroke="#A6A6A6" stroke-width="2" fill="none"/><text x="40" y="176" font-size="26" fill="#202632" font-weight="700">研究主线：围绕同一个问题组织多个方向</text><rect x="36" y="225" width="278" height="330" rx="4" fill="#F7F8FA" stroke="#A6A6A6"/><text x="60" y="272" font-size="28" fill="#202632" font-weight="700">采集设计</text><rect x="60" y="304" width="230" height="120" rx="4" fill="white" stroke="#A6A6A6"/><text x="80" y="373" font-size="22" fill="#202632" font-weight="400">该方向的关键示意</text><text x="60" y="471" font-size="22" fill="#202632" font-weight="400">得到有效输入</text><text x="60" y="518" font-size="25" fill="#555555" font-weight="700">已有基础</text><rect x="346" y="225" width="278" height="330" rx="4" fill="#FDE0E0" stroke="#C00000"/><text x="370" y="272" font-size="28" fill="#C00000" font-weight="700">模型方法</text><rect x="370" y="304" width="230" height="120" rx="4" fill="white" stroke="#A6A6A6"/><text x="390" y="373" font-size="22" fill="#202632" font-weight="400">该方向的关键示意</text><text x="370" y="471" font-size="22" fill="#202632" font-weight="400">解释或重建信息</text><text x="370" y="518" font-size="25" fill="#C00000" font-weight="700">当前工作</text><rect x="656" y="225" width="278" height="330" rx="4" fill="#F7F8FA" stroke="#A6A6A6"/><text x="680" y="272" font-size="28" fill="#202632" font-weight="700">实验验证</text><rect x="680" y="304" width="230" height="120" rx="4" fill="white" stroke="#A6A6A6"/><text x="700" y="373" font-size="22" fill="#202632" font-weight="400">该方向的关键示意</text><text x="680" y="471" font-size="22" fill="#202632" font-weight="400">核对方法效果</text><text x="680" y="518" font-size="25" fill="#555555" font-weight="700">待扩展</text><rect x="966" y="225" width="278" height="330" rx="4" fill="#F7F8FA" stroke="#A6A6A6"/><text x="990" y="272" font-size="28" fill="#202632" font-weight="700">应用评估</text><rect x="990" y="304" width="230" height="120" rx="4" fill="white" stroke="#A6A6A6"/><text x="1010" y="373" font-size="22" fill="#202632" font-weight="400">该方向的关键示意</text><text x="990" y="471" font-size="22" fill="#202632" font-weight="400">检验实际适用性</text><text x="990" y="518" font-size="25" fill="#555555" font-weight="700">后续方向</text><text x="45" y="601" font-size="24" fill="#202632" font-weight="400">分类并列不必画箭头；只有真实的数据流或依赖才连接。</text><rect x="36" y="632" width="1208" height="43" rx="4" fill="#FDE0E0" stroke="none"/><text x="58" y="662" font-size="23" fill="#202632" font-weight="700">下一页沿用相同版图，说明拟扩展方向与已有基础的联系。</text><text x="36" y="705" font-size="16" fill="#777777" font-weight="400">原创版式示意 · 无原稿图像 · 图内占位不是实验结果</text></g></svg>