<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title"><title id="title">15  研究任务与阶段成果逐项对应</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#A6A6A6"/></marker></defs><g font-family="Microsoft YaHei, Arial, sans-serif"><rect x="0" y="0" width="1280" height="720" rx="4" fill="white" stroke="none"/><text x="36" y="55" font-size="30" fill="#202632" font-weight="700">15  研究任务与阶段成果逐项对应</text><text x="36" y="95" font-size="21" fill="#555555" font-weight="400">把时间安排与成果清单建立联系；这是由参考稿提炼后的整理建议。</text><path d="M36,115 L1244,115" stroke="#A6A6A6" stroke-width="2" fill="none"/><rect x="36" y="145" width="1208" height="66" rx="4" fill="#F7F8FA" stroke="none"/><text x="58" y="185" font-size="26" fill="#202632" font-weight="700">研究问题 → 拟开展的任务 → 验证方式 → 预期输出</text><rect x="36" y="240" width="190" height="55" rx="4" fill="#FDE0E0" stroke="none"/><text x="53" y="276" font-size="24" fill="#C00000" font-weight="700">阶段</text><rect x="245" y="240" width="366" height="55" rx="4" fill="#FDE0E0" stroke="none"/><text x="262" y="276" font-size="24" fill="#C00000" font-weight="700">研究任务</text><rect x="630" y="240" width="296" height="55" rx="4" fill="#FDE0E0" stroke="none"/><text x="647" y="276" font-size="24" fill="#C00000" font-weight="700">如何验证</text><rect x="945" y="240" width="299" height="55" rx="4" fill="#FDE0E0" stroke="none"/><text x="962" y="276" font-size="24" fill="#C00000" font-weight="700">可检查的输出</text><rect x="36" y="315" width="190" height="77" rx="4" fill="#F7F8FA" stroke="none"/><text x="53" y="362" font-size="23" fill="#202632" font-weight="400">阶段 A</text><rect x="245" y="315" width="366" height="77" rx="4" fill="#F7F8FA" stroke="none"/><text x="262" y="362" font-size="23" fill="#202632" font-weight="400">梳理问题与设计方案</text><rect x="630" y="315" width="296" height="77" rx="4" fill="#F7F8FA" stroke="none"/><text x="647" y="362" font-size="23" fill="#202632" font-weight="400">小规模验证</text><rect x="945" y="315" width="299" height="77" rx="4" fill="#F7F8FA" stroke="none"/><text x="962" y="362" font-size="23" fill="#202632" font-weight="400">方案与验证记录</text><rect x="36" y="409" width="190" height="77" rx="4" fill="#F7F8FA" stroke="none"/><text x="53" y="456" font-size="23" fill="#202632" font-weight="400">阶段 B</text><rect x="245" y="409" width="366" height="77" rx="4" fill="#F7F8FA" stroke="none"/><text x="262" y="456" font-size="23" fill="#202632" font-weight="400">实现方法或实验系统</text><rect x="630" y="409" width="296" height="77" rx="4" fill="#F7F8FA" stroke="none"/><text x="647" y="456" font-size="23" fill="#202632" font-weight="400">按预定条件测试</text><rect x="945" y="409" width="299" height="77" rx="4" fill="#F7F8FA" stroke="none"/><text x="962" y="456" font-size="23" fill="#202632" font-weight="400">原型与测试记录</text><rect x="36" y="503" width="190" height="77" rx="4" fill="#F7F8FA" stroke="none"/><text x="53" y="550" font-size="23" fill="#202632" font-weight="400">阶段 C</text><rect x="245" y="503" width="366" height="77" rx="4" fill="#F7F8FA" stroke="none"/><text x="262" y="550" font-size="23" fill="#202632" font-weight="400">评估与整理研究结果</text><rect x="630" y="503" width="296" height="77" rx="4" fill="#F7F8FA" stroke="none"/><text x="647" y="550" font-size="23" fill="#202632" font-weight="400">核对适用范围</text><rect x="945" y="503" width="299" height="77" rx="4" fill="#F7F8FA" stroke="none"/><text x="962" y="550" font-size="23" fill="#202632" font-weight="400">结果与限制说明</text><text x="42" y="635" font-size="24" fill="#202632" font-weight="400">日期、指标和成果数量使用本任务材料；未确定的信息标待定。</text><text x="42" y="670" font-size="23" fill="#C00000" font-weight="700">所有条目属于计划，不将预期成果写成已实现结果。</text><text x="36" y="705" font-size="16" fill="#777777" font-weight="400">原创版式示意 · 无原稿图像 · 图内占位不是实验结果</text></g></svg>