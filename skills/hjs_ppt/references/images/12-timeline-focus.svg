<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title"><title id="title">12  连续时间线与当前节点</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#A6A6A6"/></marker></defs><g font-family="Microsoft YaHei, Arial, sans-serif"><rect x="0" y="0" width="1280" height="720" rx="4" fill="white" stroke="none"/><text x="36" y="55" font-size="30" fill="#202632" font-weight="700">12  连续时间线与当前节点</text><text x="36" y="95" font-size="21" fill="#555555" font-weight="400">适用于技术发展史、方法演进或研究阶段；也可映射到用户的深色模板。</text><path d="M36,115 L1244,115" stroke="#A6A6A6" stroke-width="2" fill="none"/><rect x="36" y="145" width="340" height="470" rx="4" fill="#F7F8FA" stroke="none"/><path d="M102,205 L102,552" stroke="#A6A6A6" stroke-width="2" fill="none"/><circle cx="102" cy="225" r="10" fill="#A6A6A6"/><text x="135" y="233" font-size="29" fill="#777777" font-weight="400">观测问题</text><circle cx="102" cy="365" r="10" fill="#C00000"/><text x="135" y="373" font-size="29" fill="#C00000" font-weight="700">建立模型</text><circle cx="102" cy="505" r="10" fill="#A6A6A6"/><text x="135" y="513" font-size="29" fill="#777777" font-weight="400">实验验证</text><text x="63" y="585" font-size="21" fill="#202632" font-weight="400">保持轨道，只切换当前节点</text><text x="422" y="184" font-size="30" fill="#C00000" font-weight="700">当前阶段：建立模型</text><rect x="422" y="214" width="822" height="220" rx="4" fill="white" stroke="#A6A6A6"/><text x="449" y="258" font-size="26" fill="#202632" font-weight="700">本阶段的机制图或证据</text><rect x="458" y="310" width="185" height="70" rx="4" fill="#F7F8FA" stroke="#A6A6A6"/><text x="509" y="353" font-size="26" fill="#202632" font-weight="400">问题</text><rect x="735" y="310" width="185" height="70" rx="4" fill="#F7F8FA" stroke="#A6A6A6"/><text x="786" y="353" font-size="26" fill="#202632" font-weight="400">模型</text><rect x="1012" y="310" width="185" height="70" rx="4" fill="#F7F8FA" stroke="#A6A6A6"/><text x="1063" y="353" font-size="26" fill="#202632" font-weight="400">预测</text><path d="M650,345 L720,345" stroke="#A6A6A6" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M927,345 L998,345" stroke="#A6A6A6" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="430" y="488" font-size="25" fill="#202632" font-weight="700">发生了什么变化：只说明当前节点</text><text x="430" y="535" font-size="25" fill="#202632" font-weight="400">证据是什么：对应的图、实验或来源</text><text x="430" y="582" font-size="25" fill="#202632" font-weight="400">为什么到下一步：仍待解决的问题</text><rect x="36" y="630" width="1208" height="45" rx="4" fill="#FDE0E0" stroke="none"/><text x="58" y="661" font-size="24" fill="#202632" font-weight="700">下一页沿用相同参照，展开“实验验证”。</text><text x="36" y="705" font-size="16" fill="#777777" font-weight="400">原创版式示意 · 无原稿图像 · 图内占位不是实验结果</text></g></svg>