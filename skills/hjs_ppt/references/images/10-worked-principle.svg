<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title"><title id="title">10  从算例到公式：样本标准差</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#A6A6A6"/></marker></defs><g font-family="Microsoft YaHei, Arial, sans-serif"><rect x="0" y="0" width="1280" height="720" rx="4" fill="white" stroke="none"/><text x="36" y="55" font-size="30" fill="#202632" font-weight="700">10  从算例到公式：样本标准差</text><text x="36" y="95" font-size="21" fill="#555555" font-weight="400">先建立直觉，再让变量、操作和数学表达式逐项对应。</text><path d="M36,115 L1244,115" stroke="#A6A6A6" stroke-width="2" fill="none"/><rect x="36" y="140" width="594" height="195" rx="4" fill="white" stroke="#A6A6A6"/><text x="57" y="180" font-size="25" fill="#C00000" font-weight="700">1. 输入：三次观测（教学数据）</text><text x="85" y="242" font-size="38" fill="#202632" font-weight="700">2       3       4  a.u.</text><text x="60" y="302" font-size="25" fill="#202632" font-weight="400">样本数 n = 3；均值 x̄ = 3 a.u.</text><rect x="655" y="140" width="589" height="465" rx="4" fill="white" stroke="#A6A6A6"/><text x="677" y="181" font-size="25" fill="#C00000" font-weight="700">2. 过程：观测值减去均值</text><path d="M725,320 L1175,320" stroke="#A6A6A6" stroke-width="2" fill="none" marker-end="url(#arrow)"/><circle cx="760" cy="320" r="7" fill="#C00000"/><text x="750" y="360" font-size="26" fill="#202632" font-weight="400">2</text><text x="739" y="420" font-size="28" fill="#C00000" font-weight="700">−1</text><circle cx="930" cy="320" r="7" fill="#C00000"/><text x="920" y="360" font-size="26" fill="#202632" font-weight="400">3</text><text x="909" y="420" font-size="28" fill="#C00000" font-weight="700">0</text><circle cx="1100" cy="320" r="7" fill="#C00000"/><text x="1090" y="360" font-size="26" fill="#202632" font-weight="400">4</text><text x="1079" y="420" font-size="28" fill="#C00000" font-weight="700">1</text><text x="677" y="480" font-size="23" fill="#202632" font-weight="400">红字为偏差；平方后为 1、0、1</text><text x="677" y="546" font-size="26" fill="#202632" font-weight="700">偏差平方和 = 2 a.u.²</text><rect x="36" y="355" width="594" height="250" rx="4" fill="white" stroke="#A6A6A6"/><text x="58" y="395" font-size="25" fill="#C00000" font-weight="700">3. 公式：除以 n−1，再开方</text><text x="68" y="455" font-size="28" fill="#202632" font-weight="400">s = √[(1 + 0 + 1) / (3 − 1)]</text><text x="68" y="510" font-size="34" fill="#C00000" font-weight="700">  = 1 a.u.</text><text x="58" y="565" font-size="23" fill="#202632" font-weight="400">分母 n−1 对应样本标准差的定义</text><rect x="36" y="628" width="1208" height="47" rx="4" fill="#FDE0E0" stroke="none"/><text x="58" y="660" font-size="25" fill="#202632" font-weight="700">这里描述样本离散；不等同于均值估计的标准误。</text><text x="36" y="705" font-size="16" fill="#777777" font-weight="400">原创教学示例 · 2、3、4 为示意数据 · 非实验结果</text></g></svg>