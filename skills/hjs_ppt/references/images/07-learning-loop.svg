<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title"><title id="title">Feedback loop with numbered explanation layout</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#A6A6A6"/></marker></defs><g font-family="Arial, sans-serif"><rect width="1280" height="720" fill="white"/><text x="36" y="53" font-size="30" fill="#202632" font-weight="700">07  Feedback loop</text><text x="36" y="94" font-size="20" fill="#555555" font-weight="400">Number the explanation in the same order as the real process.</text><path d="M36,114 H1244" stroke="#BFBFBF"/><text x="36" y="171" font-size="24" fill="#C00000" font-weight="700">1. Collect experience</text><text x="36" y="207" font-size="21" fill="#202632" font-weight="400">What is observed and stored?</text><text x="36" y="275" font-size="24" fill="#C00000" font-weight="700">2. Learn the model</text><text x="36" y="311" font-size="21" fill="#202632" font-weight="400">Which targets train the model?</text><text x="36" y="379" font-size="24" fill="#C00000" font-weight="700">3. Improve the policy</text><text x="36" y="415" font-size="21" fill="#202632" font-weight="400">What changes during learning?</text><text x="36" y="483" font-size="24" fill="#C00000" font-weight="700">4. Return to the environment</text><text x="36" y="519" font-size="21" fill="#202632" font-weight="400">How does new evidence enter?</text><rect x="637" y="178" width="245" height="106" rx="4" fill="#F7F8FA" stroke="#A6A6A6" stroke-width="1.5"/><text x="653" y="208" font-size="21" fill="#202632" font-weight="700">Environment</text><rect x="999" y="178" width="245" height="106" rx="4" fill="#F7F8FA" stroke="#A6A6A6" stroke-width="1.5"/><text x="1015" y="208" font-size="21" fill="#202632" font-weight="700">Stored data</text><rect x="999" y="447" width="245" height="106" rx="4" fill="#F7F8FA" stroke="#A6A6A6" stroke-width="1.5"/><text x="1015" y="477" font-size="21" fill="#202632" font-weight="700">Model</text><rect x="637" y="447" width="245" height="106" rx="4" fill="#F7F8FA" stroke="#A6A6A6" stroke-width="1.5"/><text x="653" y="477" font-size="21" fill="#202632" font-weight="700">Policy</text><path d="M889,230 L988,230" fill="none" stroke="#A6A6A6" stroke-width="3" marker-end="url(#arrow)"/><path d="M1121,296 L1121,434" fill="none" stroke="#A6A6A6" stroke-width="3" marker-end="url(#arrow)"/><path d="M988,500 L890,500" fill="none" stroke="#A6A6A6" stroke-width="3" marker-end="url(#arrow)"/><path d="M759,436 L759,296" fill="none" stroke="#A6A6A6" stroke-width="3" marker-end="url(#arrow)"/><rect x="36" y="620" width="1208" height="58" rx="4" fill="#FDE0E0" stroke="none" stroke-width="1.5"/><text x="52" y="657" font-size="24" fill="#202632" font-weight="700">Explain what closes the loop and which evidence corrects the next iteration.</text><text x="36" y="708" font-size="15" fill="#777777">Original layout schematic · placeholders only · no experimental data</text></g></svg>
