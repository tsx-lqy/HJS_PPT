<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title"><title id="title">13  让个人贡献找到对应证据</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#A6A6A6"/></marker></defs><g font-family="Microsoft YaHei, Arial, sans-serif"><rect x="0" y="0" width="1280" height="720" rx="4" fill="white" stroke="none"/><text x="36" y="55" font-size="30" fill="#202632" font-weight="700">13  让个人贡献找到对应证据</text><text x="36" y="95" font-size="21" fill="#555555" font-weight="400">适用于复试、答辩与项目评审；示例职责只是结构占位。</text><path d="M36,115 L1244,115" stroke="#A6A6A6" stroke-width="2" fill="none"/><rect x="36" y="145" width="1208" height="64" rx="4" fill="#F7F8FA" stroke="none"/><text x="58" y="185" font-size="26" fill="#202632" font-weight="700">本页主张：我完成了哪项工作，以及有什么证据</text><text x="56" y="265" font-size="25" fill="#C00000" font-weight="700">项目 / 工作</text><text x="420" y="265" font-size="25" fill="#C00000" font-weight="700">本人贡献</text><text x="830" y="265" font-size="25" fill="#C00000" font-weight="700">证据与当前状态</text><rect x="36" y="300" width="345" height="80" rx="4" fill="#F7F8FA" stroke="none"/><text x="56" y="348" font-size="24" fill="#202632" font-weight="700">工作 A</text><rect x="400" y="300" width="390" height="80" rx="4" fill="#FDE0E0" stroke="none"/><text x="420" y="348" font-size="24" fill="#202632" font-weight="400">完成模块设计</text><rect x="810" y="300" width="434" height="80" rx="4" fill="#F7F8FA" stroke="none"/><text x="830" y="348" font-size="24" fill="#202632" font-weight="400">设计文件 · 已完成</text><rect x="36" y="400" width="345" height="80" rx="4" fill="#F7F8FA" stroke="none"/><text x="56" y="448" font-size="24" fill="#202632" font-weight="700">工作 B</text><rect x="400" y="400" width="390" height="80" rx="4" fill="#FDE0E0" stroke="none"/><text x="420" y="448" font-size="24" fill="#202632" font-weight="400">参与实验验证</text><rect x="810" y="400" width="434" height="80" rx="4" fill="#F7F8FA" stroke="none"/><text x="830" y="448" font-size="24" fill="#202632" font-weight="400">实验记录 · 验证中</text><rect x="36" y="500" width="345" height="80" rx="4" fill="#F7F8FA" stroke="none"/><text x="56" y="548" font-size="24" fill="#202632" font-weight="700">后续工作</text><rect x="400" y="500" width="390" height="80" rx="4" fill="#FDE0E0" stroke="none"/><text x="420" y="548" font-size="24" fill="#202632" font-weight="400">计划优化方法</text><rect x="810" y="500" width="434" height="80" rx="4" fill="#F7F8FA" stroke="none"/><text x="830" y="548" font-size="24" fill="#202632" font-weight="400">方案草稿 · 待开展</text><rect x="36" y="625" width="1208" height="50" rx="4" fill="white" stroke="#C00000"/><text x="58" y="658" font-size="24" fill="#202632" font-weight="700">核对本人职责与成果状态；团队成果不自动等于个人独立贡献。</text><text x="36" y="705" font-size="16" fill="#777777" font-weight="400">原创版式示意 · 无原稿图像 · 图内占位不是实验结果</text></g></svg>