<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title"><title id="title">09  文献来源与证据同页</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#A6A6A6"/></marker></defs><g font-family="Microsoft YaHei, Arial, sans-serif"><rect x="0" y="0" width="1280" height="720" rx="4" fill="white" stroke="none"/><text x="36" y="55" font-size="30" fill="#202632" font-weight="700">09  文献来源与证据同页</text><text x="36" y="95" font-size="21" fill="#555555" font-weight="400">让观众看到结论来自哪张图、在什么条件下成立。</text><path d="M36,115 L1244,115" stroke="#A6A6A6" stroke-width="2" fill="none"/><rect x="36" y="140" width="1208" height="70" rx="4" fill="#F7F8FA" stroke="#A6A6A6"/><text x="58" y="170" font-size="22" fill="#202632" font-weight="700">来源：作者 · 年份 · 图号（完整引用放备注）</text><text x="58" y="198" font-size="21" fill="#202632" font-weight="400">本篇问题：材料中明确提出的研究问题</text><rect x="36" y="235" width="715" height="375" rx="4" fill="white" stroke="#A6A6A6"/><text x="60" y="274" font-size="25" fill="#C00000" font-weight="700">核心机制 / 系统图</text><rect x="80" y="355" width="165" height="85" rx="4" fill="#F7F8FA" stroke="#A6A6A6"/><text x="100" y="407" font-size="24" fill="#202632" font-weight="700">输入</text><rect x="310" y="355" width="165" height="85" rx="4" fill="#F7F8FA" stroke="#A6A6A6"/><text x="330" y="407" font-size="24" fill="#202632" font-weight="700">处理模块</text><rect x="540" y="355" width="165" height="85" rx="4" fill="#F7F8FA" stroke="#A6A6A6"/><text x="560" y="407" font-size="24" fill="#202632" font-weight="700">输出</text><path d="M250,398 L300,398" stroke="#A6A6A6" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M480,398 L530,398" stroke="#A6A6A6" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="62" y="561" font-size="22" fill="#202632" font-weight="400">箭头标出实际信号或数据关系；保留图中图例</text><rect x="775" y="235" width="469" height="210" rx="4" fill="white" stroke="#A6A6A6"/><text x="800" y="274" font-size="25" fill="#C00000" font-weight="700">相关实验面板</text><text x="800" y="336" font-size="22" fill="#202632" font-weight="400">同一条件 / ROI / 单位 / 图例</text><text x="800" y="402" font-size="22" fill="#202632" font-weight="400">使用用户提供的真实证据</text><text x="795" y="492" font-size="23" fill="#202632" font-weight="700">读图：指出具体差异</text><text x="795" y="534" font-size="23" fill="#202632" font-weight="400">结论：限于所报告条件</text><text x="795" y="576" font-size="23" fill="#202632" font-weight="400">局限：尚未验证的部分</text><rect x="36" y="630" width="1208" height="45" rx="4" fill="#FDE0E0" stroke="none"/><text x="58" y="660" font-size="23" fill="#202632" font-weight="700">来源 → 机制 → 证据 → 有边界的结论</text><text x="36" y="705" font-size="16" fill="#777777" font-weight="400">原创版式示意 · 无原稿图像 · 图内占位不是实验结果</text></g></svg>