<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title"><title id="title">System overview layout</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#A6A6A6"/></marker></defs><g font-family="Arial, sans-serif"><rect width="1280" height="720" fill="white"/><text x="36" y="53" font-size="30" fill="#202632" font-weight="700">01  System overview</text><text x="36" y="94" font-size="20" fill="#555555" font-weight="400">Explain how acquisition and computation produce the final output.</text><path d="M36,114 H1244" stroke="#BFBFBF"/><rect x="36" y="145" width="565" height="430" rx="4" fill="white" stroke="#A6A6A6" stroke-width="1.5" stroke-dasharray="6 5"/><rect x="679" y="145" width="565" height="430" rx="4" fill="white" stroke="#A6A6A6" stroke-width="1.5" stroke-dasharray="6 5"/><rect x="48" y="157" width="541" height="48" rx="4" fill="#FDE0E0" stroke="none" stroke-width="1.5"/><text x="64" y="187" font-size="21" fill="#C00000" font-weight="700">Acquisition / physical encoding</text><rect x="691" y="157" width="541" height="48" rx="4" fill="#FDE0E0" stroke="none" stroke-width="1.5"/><text x="707" y="187" font-size="21" fill="#C00000" font-weight="700">Computation / decoding</text><rect x="65" y="250" width="225" height="205" rx="4" fill="#F7F8FA" stroke="#A6A6A6" stroke-width="1.5"/><text x="81" y="280" font-size="21" fill="#202632" font-weight="700">System diagram</text><path d="M81,437 L274,296 M81,296 L274,437" stroke="#D5D9DF" stroke-width="1"/><rect x="355" y="300" width="210" height="115" rx="4" fill="#F7F8FA" stroke="#A6A6A6" stroke-width="1.5"/><text x="371" y="330" font-size="21" fill="#202632" font-weight="700">Measurement</text><path d="M371,397 L549,346 M371,346 L549,397" stroke="#D5D9DF" stroke-width="1"/><path d="M295,350 L347,350" fill="none" stroke="#A6A6A6" stroke-width="3" marker-end="url(#arrow)"/><path d="M610,350 L670,350" fill="none" stroke="#A6A6A6" stroke-width="3" marker-end="url(#arrow)"/><rect x="710" y="260" width="220" height="220" rx="4" fill="#F7F8FA" stroke="#A6A6A6" stroke-width="1.5"/><text x="726" y="290" font-size="21" fill="#202632" font-weight="700">Model / algorithm</text><rect x="1000" y="300" width="210" height="115" rx="4" fill="#F7F8FA" stroke="#A6A6A6" stroke-width="1.5"/><text x="1016" y="330" font-size="21" fill="#202632" font-weight="700">Output</text><path d="M1016,397 L1194,346 M1016,346 L1194,397" stroke="#D5D9DF" stroke-width="1"/><path d="M935,350 L991,350" fill="none" stroke="#A6A6A6" stroke-width="3" marker-end="url(#arrow)"/><text x="82" y="510" font-size="20" fill="#202632" font-weight="400">Label the signal or data on each connection.</text><text x="710" y="526" font-size="20" fill="#202632" font-weight="400">Inputs, outputs, and feedback stay visible.</text><text x="36" y="708" font-size="15" fill="#777777">Original layout schematic · placeholders only · no experimental data</text></g></svg>
