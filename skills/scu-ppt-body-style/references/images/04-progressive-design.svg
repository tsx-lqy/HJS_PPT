<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title"><title id="title">Progressive system explanation layout</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#A6A6A6"/></marker></defs><g font-family="Arial, sans-serif"><rect width="1280" height="720" fill="white"/><text x="36" y="53" font-size="30" fill="#202632" font-weight="700">04  Progressive system explanation</text><text x="36" y="94" font-size="20" fill="#555555" font-weight="400">Keep a local route map while expanding one design choice.</text><path d="M36,114 H1244" stroke="#BFBFBF"/><rect x="36" y="150" width="270" height="280" rx="4" fill="white" stroke="#C00000" stroke-width="1.5" stroke-dasharray="6 5"/><text x="56" y="195" font-size="24" fill="#202632" font-weight="400">1. Excite / input</text><text x="56" y="255" font-size="24" fill="#C00000" font-weight="700">2. Detect / measure</text><text x="56" y="315" font-size="23" fill="#A6A6A6" font-weight="400">3. Scan / transform</text><text x="56" y="347" font-size="23" fill="#A6A6A6" font-weight="400">4. Control / output</text><text x="44" y="480" font-size="24" fill="#C00000" font-weight="700">Selected option</text><text x="44" y="521" font-size="21" fill="#202632" font-weight="400">State the trade-off.</text><text x="44" y="553" font-size="21" fill="#202632" font-weight="400">Explain the choice.</text><rect x="352" y="150" width="434" height="430" rx="4" fill="white" stroke="#A6A6A6" stroke-width="1.5" stroke-dasharray="6 5"/><text x="372" y="190" font-size="25" fill="#202632" font-weight="700">Option A</text><rect x="372" y="215" width="394" height="233" rx="4" fill="#F7F8FA" stroke="#A6A6A6" stroke-width="1.5"/><text x="388" y="245" font-size="21" fill="#202632" font-weight="700">Functional diagram</text><path d="M388,430 L750,261 M388,261 L750,430" stroke="#D5D9DF" stroke-width="1"/><text x="372" y="500" font-size="22" fill="#202632" font-weight="400">Main advantage</text><text x="372" y="532" font-size="22" fill="#202632" font-weight="400">Main limitation</text><rect x="810" y="150" width="434" height="430" rx="4" fill="white" stroke="#A6A6A6" stroke-width="1.5" stroke-dasharray="6 5"/><text x="830" y="190" font-size="25" fill="#202632" font-weight="700">Option B</text><rect x="830" y="215" width="394" height="233" rx="4" fill="#F7F8FA" stroke="#A6A6A6" stroke-width="1.5"/><text x="846" y="245" font-size="21" fill="#202632" font-weight="700">Functional diagram</text><path d="M846,430 L1208,261 M846,261 L1208,430" stroke="#D5D9DF" stroke-width="1"/><text x="830" y="500" font-size="22" fill="#202632" font-weight="400">Main advantage</text><text x="830" y="532" font-size="22" fill="#202632" font-weight="400">Main limitation</text><text x="36" y="708" font-size="15" fill="#777777">Original layout schematic · placeholders only · no experimental data</text></g></svg>
