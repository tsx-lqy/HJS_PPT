<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title"><title id="title">11  用同一需求比较不同技术路线</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#A6A6A6"/></marker></defs><g font-family="Microsoft YaHei, Arial, sans-serif"><rect x="0" y="0" width="1280" height="720" rx="4" fill="white" stroke="none"/><text x="36" y="55" font-size="30" fill="#202632" font-weight="700">11  用同一需求比较不同技术路线</text><text x="36" y="95" font-size="21" fill="#555555" font-weight="400">每行对应一个方案；没有依据的性能结论标为待测。</text><path d="M36,115 L1244,115" stroke="#A6A6A6" stroke-width="2" fill="none"/><rect x="36" y="145" width="1208" height="68" rx="4" fill="#F7F8FA" stroke="none"/><text x="56" y="185" font-size="26" fill="#202632" font-weight="700">共同需求：说明本次任务的目标和约束</text><text x="66" y="262" font-size="25" fill="#C00000" font-weight="700">方案</text><text x="320" y="262" font-size="25" fill="#202632" font-weight="700">可带来的收益</text><text x="800" y="262" font-size="25" fill="#202632" font-weight="700">代价 / 限制 / 待测项</text><rect x="36" y="300" width="230" height="80" rx="4" fill="#FDE0E0" stroke="none"/><text x="66" y="349" font-size="27" fill="#C00000" font-weight="700">方案 A</text><rect x="285" y="300" width="470" height="80" rx="4" fill="#F7F8FA" stroke="none"/><text x="305" y="349" font-size="24" fill="#202632" font-weight="400">材料支持的优势</text><rect x="775" y="300" width="469" height="80" rx="4" fill="#F7F8FA" stroke="none"/><text x="795" y="349" font-size="24" fill="#202632" font-weight="400">需要满足的使用条件</text><rect x="36" y="400" width="230" height="80" rx="4" fill="#FDE0E0" stroke="none"/><text x="66" y="449" font-size="27" fill="#C00000" font-weight="700">方案 B</text><rect x="285" y="400" width="470" height="80" rx="4" fill="#F7F8FA" stroke="none"/><text x="305" y="449" font-size="24" fill="#202632" font-weight="400">与当前目标相关的优势</text><rect x="775" y="400" width="469" height="80" rx="4" fill="#F7F8FA" stroke="none"/><text x="795" y="449" font-size="24" fill="#202632" font-weight="400">仍需验证的性能</text><rect x="36" y="500" width="230" height="80" rx="4" fill="#FDE0E0" stroke="none"/><text x="66" y="549" font-size="27" fill="#C00000" font-weight="700">方案 C</text><rect x="285" y="500" width="470" height="80" rx="4" fill="#F7F8FA" stroke="none"/><text x="305" y="549" font-size="24" fill="#202632" font-weight="400">可保留的能力</text><rect x="775" y="500" width="469" height="80" rx="4" fill="#F7F8FA" stroke="none"/><text x="795" y="549" font-size="24" fill="#202632" font-weight="400">必须承担的代价</text><rect x="36" y="625" width="1208" height="50" rx="4" fill="white" stroke="#C00000"/><text x="58" y="659" font-size="24" fill="#202632" font-weight="700">有条件的选择：若优先满足……，则先验证……；尚需测量……。</text><text x="36" y="705" font-size="16" fill="#777777" font-weight="400">原创版式示意 · 无原稿图像 · 图内占位不是实验结果</text></g></svg>