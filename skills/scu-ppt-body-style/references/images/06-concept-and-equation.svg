<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title"><title id="title">Diagram with numbered equations layout</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#A6A6A6"/></marker></defs><g font-family="Arial, sans-serif"><rect width="1280" height="720" fill="white"/><text x="36" y="53" font-size="30" fill="#202632" font-weight="700">06  Diagram and equations</text><text x="36" y="94" font-size="20" fill="#555555" font-weight="400">Match each explanation to a visible part of the mechanism.</text><path d="M36,114 H1244" stroke="#BFBFBF"/><rect x="36" y="148" width="645" height="442" rx="4" fill="white" stroke="#A6A6A6" stroke-width="1.5" stroke-dasharray="6 5"/><text x="52" y="178" font-size="21" fill="#202632" font-weight="700">Main structure / mechanism</text><rect x="76" y="298" width="155" height="88" rx="4" fill="#F7F8FA" stroke="#A6A6A6" stroke-width="1.5"/><text x="92" y="328" font-size="21" fill="#202632" font-weight="700">Input</text><rect x="280" y="298" width="155" height="88" rx="4" fill="#F7F8FA" stroke="#A6A6A6" stroke-width="1.5"/><text x="296" y="328" font-size="21" fill="#202632" font-weight="700">State</text><rect x="484" y="298" width="155" height="88" rx="4" fill="#F7F8FA" stroke="#A6A6A6" stroke-width="1.5"/><text x="500" y="328" font-size="21" fill="#202632" font-weight="700">Output</text><path d="M236,342 L270,342" fill="none" stroke="#A6A6A6" stroke-width="3" marker-end="url(#arrow)"/><path d="M440,342 L474,342" fill="none" stroke="#A6A6A6" stroke-width="3" marker-end="url(#arrow)"/><text x="65" y="545" font-size="21" fill="#555555" font-weight="400">Variables and notation key</text><text x="729" y="182" font-size="25" fill="#C00000" font-weight="700">1. State update</text><rect x="729" y="207" width="505" height="100" rx="4" fill="#F7F8FA" stroke="none" stroke-width="1.5"/><text x="745" y="237" font-size="21" fill="#202632" font-weight="700">Key equation</text><text x="729" y="345" font-size="21" fill="#202632" font-weight="400">Explain what enters, what changes,</text><text x="729" y="377" font-size="21" fill="#202632" font-weight="400">and what each symbol represents.</text><text x="729" y="443" font-size="25" fill="#C00000" font-weight="700">2. Output mapping</text><rect x="729" y="466" width="505" height="63" rx="4" fill="#F7F8FA" stroke="none" stroke-width="1.5"/><text x="745" y="496" font-size="21" fill="#202632" font-weight="700">Key equation</text><text x="729" y="566" font-size="21" fill="#202632" font-weight="400">Explain its role and relevant assumptions.</text><rect x="36" y="620" width="1208" height="58" rx="4" fill="#FDE0E0" stroke="none" stroke-width="1.5"/><text x="52" y="657" font-size="24" fill="#202632" font-weight="700">One limitation, distinction, or transition to the next concept</text><text x="36" y="708" font-size="15" fill="#777777">Original layout schematic · placeholders only · no experimental data</text></g></svg>
